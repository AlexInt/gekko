[tool.poetry]
name = "gekko-reborn-backend"
version = "0.1.0"
description = "AI-powered crypto trading bot backend"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
pydantic = {extras = ["email"], version = "^2.6.0"}
pydantic-settings = "^2.1.0"
asyncpg = "^0.29.0"
ccxt = "^4.2.14"
pandas = "^2.2.0"
numpy = "^1.26.3"
scikit-learn = "^1.4.0"
torch = "^2.2.0"
apscheduler = "^3.10.4"
redis = "^5.0.1"
celery = "^5.3.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
ta-lib = "^0.4.28"
greenlet = "^3.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.1"
isort = "^5.13.2"
mypy = "^1.8.0"
pytest-asyncio = "^1.3.0"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
